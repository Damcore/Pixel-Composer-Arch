name: Apply validated Linux runtime fixes

on:
  push:
    branches: [arch-linux]
    paths:
      - '.github/workflows/arch-linux-apply-runtime-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply validated patch from previous workflow revision
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/arch-linux-apply-runtime-fixes.yml > /tmp/previous.yml
          awk '
            /python3 - <<.PY./ { found=1; next }
            found && /^          PY$/ { exit }
            found { sub(/^          /, ""); print }
          ' /tmp/previous.yml > /tmp/apply-runtime-fixes.py
          test -s /tmp/apply-runtime-fixes.py
          python3 /tmp/apply-runtime-fixes.py

          # Remove indentation from the four blank lines introduced by the patch.
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'objects/o_main/Other_2.gml': [
                  ('environment_set_variable("APPIMAGE_EXTRACT_AND_RUN", "1");\n\t\t\n\t\tvar _home',
                   'environment_set_variable("APPIMAGE_EXTRACT_AND_RUN", "1");\n\n\t\tvar _home'),
              ],
              'scripts/__initAddon/__initAddon.gml': [
                  ('if(!LUA_AVAILABLE) return;\n\t\n\tdirectory_verify',
                   'if(!LUA_AVAILABLE) return;\n\n\tdirectory_verify'),
              ],
              'scripts/node_export/node_export.gml': [
                  ('if(!directory_exists(_imDir) && directory_exists(_imDirBundled)) _imDir = _imDirBundled;\n\t\t\t\n\t\t\tconverter',
                   'if(!directory_exists(_imDir) && directory_exists(_imDirBundled)) _imDir = _imDirBundled;\n\n\t\t\tconverter'),
              ],
              'scripts/sprite_add_functions/sprite_add_functions.gml': [
                  ('var path_magick  = "";\n\t\n\tswitch(OS)',
                   'var path_magick  = "";\n\n\tswitch(OS)'),
              ],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'{filename}: whitespace cleanup marker missing')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY

          git diff --check
          python3 -m json.tool datasrc/Nodes/Internal/Misc/Node_Lua_Compute/info.json >/dev/null
          python3 -m json.tool datasrc/Nodes/Internal/Misc/Node_Lua_Global/info.json >/dev/null
          python3 -m json.tool datasrc/Nodes/Internal/Misc/Node_Lua_Surface/info.json >/dev/null
          git status --short

      - name: Commit fixes to arch-linux
        run: |
          set -euo pipefail
          git config user.name "Merlin"
          git config user.email "merlinp2000@gmail.com"
          git add objects/o_main/Other_2.gml \
            scripts/__initAddon/__initAddon.gml \
            scripts/node_registry/node_registry.gml \
            scripts/shell_functions/shell_functions.gml \
            scripts/preferences/preferences.gml \
            scripts/node_export/node_export.gml \
            scripts/sprite_add_functions/sprite_add_functions.gml \
            scripts/debug/debug.gml \
            datasrc/Nodes/Internal/Misc/Node_Lua_Compute/info.json \
            datasrc/Nodes/Internal/Misc/Node_Lua_Global/info.json \
            datasrc/Nodes/Internal/Misc/Node_Lua_Surface/info.json
          git commit -m "linux: harden runtime paths and gate optional Lua features"
          git push origin HEAD:arch-linux
