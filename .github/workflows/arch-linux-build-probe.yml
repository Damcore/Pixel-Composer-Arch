name: Arch Linux build probe

on:
  push:
    branches: [arch-linux]
    paths:
      - '.github/workflows/arch-linux-build-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUNTIME_VERSION: 2026.100.0.1098
      RUNTIME_FEED: https://gms.yoyogames.com/Zeus-Runtime-NuBeta.rss
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates clang curl ffmpeg fuse libglu1-mesa \
            libopenal1 libpulse0 openssh-client python3 unzip xauth xdg-utils xvfb zip

      - name: Install GameMaker CLI project tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/gmtools"
          cd "$RUNNER_TEMP/gmtools"
          npm install --registry=https://gmpm.gamemaker.io \
            @gm-tools/project-tool-linux-x64 \
            @gm-tools/package-tool-linux-x64 \
            @gm-tools/gmpm-linux-x64

      - name: Restore project Prefabs
        run: |
          set -euxo pipefail
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          PKG="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/package-tool-linux-x64/PackageTool"
          GMPM="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/gmpm-linux-x64/gmpm.dll"
          chmod +x "$PT" "$PKG"
          "$PT" PREFABS RESTORE \
            SOURCE="$GITHUB_WORKSPACE/PixelComposer.yyp" \
            PACKAGETOOL="$PKG" \
            GMPM_DLL="$GMPM"

      - name: Prepare source-only Linux build
        run: |
          set -euxo pipefail
          # Apollo is optional/proprietary and upstream documents Lua as unsupported on Linux.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extensions/Apollo/Apollo.yy')
          s = p.read_text()
          old = '"copyToTargets":194,"filename":"Apollo.dll"'
          new = '"copyToTargets":66,"filename":"Apollo.dll"'
          if s.count(old) != 1:
              raise SystemExit(f'Unexpected Apollo descriptor count: {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          bash ./pre_build_step.sh
          test -s datafiles/pack/collections.zip

      - name: Install GameMaker beta runtime
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/igor-bootstrap" "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/gm-user"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/igor.zip" https://gms.yoyogames.com/igor_linux-x64.zip
          unzip -q "$RUNNER_TEMP/igor.zip" -d "$RUNNER_TEMP/igor-bootstrap"
          IGOR="$RUNNER_TEMP/igor-bootstrap/linux/x64/Igor"
          chmod +x "$IGOR"
          "$IGOR" \
            /rp="$RUNNER_TEMP/runtimes" \
            /ru="$RUNTIME_FEED" \
            /uf="$RUNNER_TEMP/gm-user" \
            /m=linux,base,base-module-linux-x64 \
            -- Runtime Install "$RUNTIME_VERSION"

      - name: Compile Pixel Composer Linux VM
        run: |
          set -euxo pipefail
          RUNTIME="$RUNNER_TEMP/runtimes/runtime-$RUNTIME_VERSION"
          IGOR="$RUNTIME/bin/igor/linux/x64/Igor"
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          mkdir -p "$RUNNER_TEMP/gm-cache" "$RUNNER_TEMP/gm-build-temp"
          chmod +x "$IGOR" "$RUNTIME/bin/assetcompiler/linux/x64/GMAssetCompiler" "$PT"
          "$IGOR" \
            /uf="$RUNNER_TEMP/gm-user" \
            /rp="$RUNTIME" \
            /project="$GITHUB_WORKSPACE/PixelComposer.yyp" \
            /cache="$RUNNER_TEMP/gm-cache" \
            /temp="$RUNNER_TEMP/gm-build-temp" \
            /pf="$GITHUB_WORKSPACE/prefabs" \
            /pt="$PT" \
            -j=8 \
            -- Linux Compile 2>&1 | tee "$RUNNER_TEMP/linux-compile.log"

      - name: Inspect and smoke-test compiled VM build
        run: |
          set -euxo pipefail
          BUILD_ZIP=$(find "$GITHUB_WORKSPACE/output" -type f -name 'PixelComposer.zip' -print -quit)
          test -n "$BUILD_ZIP"
          echo "BUILD_ZIP=$BUILD_ZIP"
          file "$BUILD_ZIP"
          unzip -q "$BUILD_ZIP" -d "$RUNNER_TEMP/vm-build"
          find "$RUNNER_TEMP/vm-build" -maxdepth 3 -type f -printf '%M %s %p\n' | sort -k2 -nr | head -120
          find "$RUNNER_TEMP/vm-build" -type f -perm /111 -exec file {} \; | tee "$RUNNER_TEMP/vm-executables.log"

          EXE=$(find "$RUNNER_TEMP/vm-build" -type f \( -name PixelComposer -o -name runner \) -perm /111 -print -quit)
          if [ -z "$EXE" ]; then
            EXE=$(find "$RUNNER_TEMP/vm-build" -type f -perm /111 -print -quit)
          fi
          test -n "$EXE"
          echo "Launching under Xvfb: $EXE"

          set +e
          timeout 20s xvfb-run -a "$EXE" >"$RUNNER_TEMP/vm-smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vm-smoke.log"
          echo "VM_SMOKE_EXIT=$rc"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Inspect compile output
        if: always()
        run: |
          set -x
          find "$GITHUB_WORKSPACE/output" -maxdepth 4 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -100 || true
          test -f "$RUNNER_TEMP/linux-compile.log" && tail -120 "$RUNNER_TEMP/linux-compile.log" || true
          test -f "$RUNNER_TEMP/vm-smoke.log" && tail -160 "$RUNNER_TEMP/vm-smoke.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-composer-linux-vm-compile
          path: |
            ${{ github.workspace }}/output/PixelComposer/PixelComposer.zip
            ${{ runner.temp }}/linux-compile.log
            ${{ runner.temp }}/vm-smoke.log
            ${{ runner.temp }}/vm-executables.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
