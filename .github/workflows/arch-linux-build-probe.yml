name: Arch Linux build probe

on:
  push:
    branches: [arch-linux]
    paths:
      - '.github/workflows/arch-linux-build-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUNTIME_VERSION: 2026.100.0.1098
      RUNTIME_FEED: https://gms.yoyogames.com/Zeus-Runtime-NuBeta.rss
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates clang curl ffmpeg fuse libglu1-mesa \
            libopenal1 libpulse0 openssh-client python3 unzip xauth xdg-utils xvfb zip

      - name: Install GameMaker CLI project tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/gmtools"
          cd "$RUNNER_TEMP/gmtools"
          npm install --registry=https://gmpm.gamemaker.io \
            @gm-tools/project-tool-linux-x64 \
            @gm-tools/package-tool-linux-x64 \
            @gm-tools/gmpm-linux-x64

      - name: Restore project Prefabs
        run: |
          set -euxo pipefail
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          PKG="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/package-tool-linux-x64/PackageTool"
          GMPM="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/gmpm-linux-x64/gmpm.dll"
          chmod +x "$PT" "$PKG"
          "$PT" PREFABS RESTORE SOURCE="$GITHUB_WORKSPACE/PixelComposer.yyp" PACKAGETOOL="$PKG" GMPM_DLL="$GMPM"

      - name: Build Linux Apollo compatibility shim
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/apollo_linux_stub.c" <<'EOF'
          // Linux no-op bridge for the optional proprietary Apollo extension.
          // Pixel Composer documents Lua nodes as unsupported on Linux; keeping
          // these ABI symbols available prevents the rest of the editor from
          // failing during extension resolution when Apollo.so is not present.
          #include <stddef.h>
          #define API __attribute__((visibility("default")))
          API double lua_show_error(const char *s) { (void)s; return 0.0; }
          API double lua_reset(void) { return 0.0; }
          API double lua_set_cwd(const char *s) { (void)s; return 0.0; }
          API double lua_state_create(void) { return 0.0; }
          API double lua_state_destroy(double a) { (void)a; return 0.0; }
          API double lua_thread_create(double a) { (void)a; return 0.0; }
          API double lua_thread_destroy(double a) { (void)a; return 0.0; }
          API double lua_state_exists(double a) { (void)a; return 0.0; }
          API double lua_state_reuse_indexes(void) { return 0.0; }
          API double lua_add_function_raw(double a, const char *b, double c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_state_get_interop_depth(double a) { (void)a; return 0.0; }
          API double lua_state_exec_raw(const char *a) { (void)a; return 0.0; }
          API double lua_call_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_add_code_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_add_file_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_global_get_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_global_set_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_global_type_raw(double a, const char *b) { (void)a; (void)b; return 0.0; }
          API double lua_call_start_raw(double a, const char *b, const char *c) { (void)a; (void)b; (void)c; return 0.0; }
          API double lua_call_next_raw(double a, const char *b) { (void)a; (void)b; return 0.0; }
          API double lua_init_raw(const char *a) { (void)a; return 0.0; }
          API double lua_update_method_gc(const char *a, double b) { (void)a; (void)b; return 0.0; }
          API double lua_update_ref_gc(const char *a, double b) { (void)a; (void)b; return 0.0; }
          EOF
          cc -shared -fPIC -O2 -Wl,-soname,Apollo.so -o extensions/Apollo/Apollo.so "$RUNNER_TEMP/apollo_linux_stub.c"
          file extensions/Apollo/Apollo.so
          nm -D --defined-only extensions/Apollo/Apollo.so | grep ' lua_' | sort

      - name: Prepare source-only Linux build
        run: |
          set -euxo pipefail
          bash ./pre_build_step.sh
          test -s datafiles/pack/collections.zip

      - name: Install GameMaker beta runtime
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/igor-bootstrap" "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/gm-user"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/igor.zip" https://gms.yoyogames.com/igor_linux-x64.zip
          unzip -q "$RUNNER_TEMP/igor.zip" -d "$RUNNER_TEMP/igor-bootstrap"
          IGOR="$RUNNER_TEMP/igor-bootstrap/linux/x64/Igor"
          chmod +x "$IGOR"
          "$IGOR" /rp="$RUNNER_TEMP/runtimes" /ru="$RUNTIME_FEED" /uf="$RUNNER_TEMP/gm-user" /m=linux,base,base-module-linux-x64 -- Runtime Install "$RUNTIME_VERSION"

      - name: Compile Pixel Composer Linux VM
        run: |
          set -euxo pipefail
          RUNTIME="$RUNNER_TEMP/runtimes/runtime-$RUNTIME_VERSION"
          IGOR="$RUNTIME/bin/igor/linux/x64/Igor"
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          mkdir -p "$RUNNER_TEMP/gm-cache" "$RUNNER_TEMP/gm-build-temp"
          chmod +x "$IGOR" "$RUNTIME/bin/assetcompiler/linux/x64/GMAssetCompiler" "$PT"
          "$IGOR" /uf="$RUNNER_TEMP/gm-user" /rp="$RUNTIME" /project="$GITHUB_WORKSPACE/PixelComposer.yyp" /cache="$RUNNER_TEMP/gm-cache" /temp="$RUNNER_TEMP/gm-build-temp" /pf="$GITHUB_WORKSPACE/prefabs" /pt="$PT" -j=8 -- Linux Compile 2>&1 | tee "$RUNNER_TEMP/linux-compile.log"

      - name: Smoke-test with GameMaker Linux runner
        run: |
          set -euxo pipefail
          RUNTIME="$RUNNER_TEMP/runtimes/runtime-$RUNTIME_VERSION"
          BUILD_ZIP=$(find "$GITHUB_WORKSPACE/output" -type f -name 'PixelComposer.zip' -print -quit)
          test -n "$BUILD_ZIP"
          mkdir -p "$RUNNER_TEMP/vm-build" "$RUNNER_TEMP/gm-runner"
          unzip -q "$BUILD_ZIP" -d "$RUNNER_TEMP/vm-build"
          unzip -q "$RUNTIME/linux/runner.zip" -d "$RUNNER_TEMP/gm-runner"
          cp "$RUNNER_TEMP/gm-runner/runner" "$RUNNER_TEMP/vm-build/runner"
          chmod +x "$RUNNER_TEMP/vm-build/runner"
          cd "$RUNNER_TEMP/vm-build"
          set +e
          timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' ./runner >"$RUNNER_TEMP/vm-smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vm-smoke.log"
          echo "VM_SMOKE_EXIT=$rc"
          if grep -q 'ERROR!!!' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          if grep -q 'Unable to find function lua_' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi

      - name: Inspect compile output
        if: always()
        run: |
          set -x
          find "$GITHUB_WORKSPACE/output" -maxdepth 4 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -100 || true
          test -f "$RUNNER_TEMP/linux-compile.log" && tail -120 "$RUNNER_TEMP/linux-compile.log" || true
          test -f "$RUNNER_TEMP/vm-smoke.log" && tail -180 "$RUNNER_TEMP/vm-smoke.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-composer-linux-vm-compile
          path: |
            ${{ github.workspace }}/output/PixelComposer/PixelComposer.zip
            ${{ runner.temp }}/linux-compile.log
            ${{ runner.temp }}/vm-smoke.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
