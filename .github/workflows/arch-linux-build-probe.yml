name: Arch Linux build probe

on:
  push:
    branches: [arch-linux]
    paths:
      - '.github/workflows/arch-linux-build-probe.yml'
      - 'pre_build_step.sh'
      - 'pre_run.py'
      - 'datasrc/update.py'
      - 'tools/arch-linux/**'
      - 'options/linux/**'
      - 'objects/o_main/**'
      - 'scripts/**'
      - 'datasrc/Nodes/Internal/Misc/Node_Lua_*/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUNTIME_VERSION: 2026.100.0.1098
      RUNTIME_FEED: https://gms.yoyogames.com/Zeus-Runtime-NuBeta.rss
      PXC_UI_FREEZE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Validate sandbox helper syntax
        run: bash -n ./tools/arch-linux/sandbox-build-smoke.sh

      - name: Install Linux build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ca-certificates clang curl ffmpeg fuse libglu1-mesa \
            libopenal1 libpulse0 openssh-client python3 unzip xauth xdg-utils xvfb zip

      - name: Install GameMaker CLI project tools
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/gmtools"
          cd "$RUNNER_TEMP/gmtools"
          npm install --registry=https://gmpm.gamemaker.io \
            @gm-tools/project-tool-linux-x64 \
            @gm-tools/package-tool-linux-x64 \
            @gm-tools/gmpm-linux-x64

      - name: Restore project Prefabs
        run: |
          set -euxo pipefail
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          PKG="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/package-tool-linux-x64/PackageTool"
          GMPM="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/gmpm-linux-x64/gmpm.dll"
          chmod +x "$PT" "$PKG"
          "$PT" PREFABS RESTORE \
            SOURCE="$GITHUB_WORKSPACE/PixelComposer.yyp" \
            PACKAGETOOL="$PKG" \
            GMPM_DLL="$GMPM"

      - name: Prepare source-only Linux build
        run: |
          set -euxo pipefail
          bash ./pre_build_step.sh
          test -s extensions/Apollo/Apollo.so
          test -s extensions/Apollo/apollo_call.gml
          test -s datafiles/pack/collections.zip
          grep -q '"option_linux_disable_sandbox":true' options/linux/options_linux.yy

      - name: Install GameMaker beta runtime
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/igor-bootstrap" "$RUNNER_TEMP/runtimes" "$RUNNER_TEMP/gm-user"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/igor.zip" \
            https://gms.yoyogames.com/igor_linux-x64.zip
          unzip -q "$RUNNER_TEMP/igor.zip" -d "$RUNNER_TEMP/igor-bootstrap"
          IGOR="$RUNNER_TEMP/igor-bootstrap/linux/x64/Igor"
          chmod +x "$IGOR"
          "$IGOR" \
            /rp="$RUNNER_TEMP/runtimes" \
            /ru="$RUNTIME_FEED" \
            /uf="$RUNNER_TEMP/gm-user" \
            /m=linux,base,base-module-linux-x64 \
            -- Runtime Install "$RUNTIME_VERSION"

      - name: Compile Pixel Composer Linux VM
        run: |
          set -euxo pipefail
          RUNTIME="$RUNNER_TEMP/runtimes/runtime-$RUNTIME_VERSION"
          IGOR="$RUNTIME/bin/igor/linux/x64/Igor"
          PT="$RUNNER_TEMP/gmtools/node_modules/@gm-tools/project-tool-linux-x64/ProjectTool"
          mkdir -p "$RUNNER_TEMP/gm-cache" "$RUNNER_TEMP/gm-build-temp"
          chmod +x "$IGOR" "$RUNTIME/bin/assetcompiler/linux/x64/GMAssetCompiler" "$PT"
          "$IGOR" \
            /uf="$RUNNER_TEMP/gm-user" \
            /rp="$RUNTIME" \
            /project="$GITHUB_WORKSPACE/PixelComposer.yyp" \
            /cache="$RUNNER_TEMP/gm-cache" \
            /temp="$RUNNER_TEMP/gm-build-temp" \
            /pf="$GITHUB_WORKSPACE/prefabs" \
            /pt="$PT" \
            -j=8 \
            -- Linux Compile 2>&1 | tee "$RUNNER_TEMP/linux-compile.log"
          grep -q 'Final Compile finished' "$RUNNER_TEMP/linux-compile.log"

      - name: Extract compiled VM build
        run: |
          set -euxo pipefail
          BUILD_ZIP=$(find "$GITHUB_WORKSPACE/output" -type f -name 'PixelComposer.zip' -print -quit)
          test -n "$BUILD_ZIP"
          mkdir -p "$RUNNER_TEMP/vm-build"
          unzip -q "$BUILD_ZIP" -d "$RUNNER_TEMP/vm-build"
          test -s "$RUNNER_TEMP/vm-build/assets/game.unx"

      - name: Smoke-test bundled ImageMagick import proxy
        run: |
          set -euxo pipefail
          IM=$(find "$RUNNER_TEMP/vm-build" -type f -iname 'imagemagick.appimage' -print -quit)
          test -n "$IM"
          chmod +x "$IM"
          mkdir -p "$RUNNER_TEMP/image-proxy-test"
          APPIMAGE_EXTRACT_AND_RUN=1 "$IM" \
            -size 8x8 gradient: -depth 16 "$RUNNER_TEMP/image-proxy-test/in16.png"
          APPIMAGE_EXTRACT_AND_RUN=1 "$IM" \
            "$RUNNER_TEMP/image-proxy-test/in16.png" -depth 8 "$RUNNER_TEMP/image-proxy-test/out8.png"
          APPIMAGE_EXTRACT_AND_RUN=1 "$IM" \
            "$RUNNER_TEMP/image-proxy-test/out8.png" "$RUNNER_TEMP/image-proxy-test/in.webp"
          APPIMAGE_EXTRACT_AND_RUN=1 "$IM" \
            "$RUNNER_TEMP/image-proxy-test/in.webp" "$RUNNER_TEMP/image-proxy-test/webp-proxy.png"
          test -s "$RUNNER_TEMP/image-proxy-test/out8.png"
          test -s "$RUNNER_TEMP/image-proxy-test/webp-proxy.png"

      - name: Smoke-test Pixel Composer with GameMaker Linux runner
        run: |
          set -euxo pipefail
          RUNTIME="$RUNNER_TEMP/runtimes/runtime-$RUNTIME_VERSION"
          mkdir -p "$RUNNER_TEMP/gm-runner"
          unzip -q "$RUNTIME/linux/runner.zip" -d "$RUNNER_TEMP/gm-runner"
          cp "$RUNNER_TEMP/gm-runner/runner" "$RUNNER_TEMP/vm-build/runner"
          chmod +x "$RUNNER_TEMP/vm-build/runner"
          rm -rf "$HOME/PixelComposer"
          cd "$RUNNER_TEMP/vm-build"
          set +e
          SDL_AUDIODRIVER=dummy timeout 45s \
            xvfb-run -a -s '-screen 0 1920x1080x24' ./runner \
            >"$RUNNER_TEMP/vm-smoke.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vm-smoke.log"
          echo "VM_SMOKE_EXIT=$rc"
          grep -q '\[Linux diagnostic\] UI snapshot freeze enabled' "$RUNNER_TEMP/vm-smoke.log"
          if grep -q 'ERR:{' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          if grep -q 'ERROR!!!' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          if grep -q 'Unable to find function lua_' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          if grep -q 'Could not find function "lua_' "$RUNNER_TEMP/vm-smoke.log"; then exit 1; fi
          test -s "$HOME/PixelComposer/Themes/default HQ/graphics/graphics.json"
          if [ "$rc" -ne 124 ]; then
            echo "Pixel Composer exited before the 45s startup smoke window completed (rc=$rc)." >&2
            exit 1
          fi

      - name: Inspect outputs
        if: always()
        run: |
          set -x
          find "$GITHUB_WORKSPACE/output" -maxdepth 4 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -100 || true
          test -f "$RUNNER_TEMP/linux-compile.log" && tail -120 "$RUNNER_TEMP/linux-compile.log" || true
          test -f "$RUNNER_TEMP/vm-smoke.log" && tail -220 "$RUNNER_TEMP/vm-smoke.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-composer-linux-vm-compile
          path: |
            ${{ github.workspace }}/output/PixelComposer/PixelComposer.zip
            ${{ runner.temp }}/linux-compile.log
            ${{ runner.temp }}/vm-smoke.log
            ${{ runner.temp }}/image-proxy-test
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
