name: Apply final Linux portability polish

on:
  push:
    branches: [arch-linux]
    paths:
      - '.github/workflows/arch-linux-final-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply and validate final Linux fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'scripts/file_functions/file_functions.gml',
              '_arg[$ "--pref"]  = $"{DIRECTORY}Preferences\\\\fs.json";',
              '_arg[$ "--pref"]  = $"{DIRECTORY}Preferences/fs.json";'
          )

          replace_once(
              'scripts/window_functions/window_functions.gml',
              '''function Program_Restart() {\n\tvar _exePath = program_directory;\n\tshell_execute("", $"start \\\"\\\" /D \\\"{_exePath}\\\" \\\"PixelComposer.exe\\\"");\n\tProgram_Close();\n}''',
              '''function Program_Restart() {\n\tif(OS == os_windows) {\n\t\tvar _exePath = program_directory;\n\t\tshell_execute("", $"start \\\"\\\" /D \\\"{_exePath}\\\" \\\"PixelComposer.exe\\\"");\n\t} else {\n\t\t// On Linux/macOS parameter 0 is the current executable. Re-launch that\n\t\t// instead of assuming the Windows PixelComposer.exe filename.\n\t\tvar _exe = parameter_string(0);\n\t\tif(_exe != "") shell_execute_async(string_quote(_exe), "");\n\t}\n\tProgram_Close();\n}'''
          )

          replace_once(
              'tools/arch-linux/apollo_linux_stub.c',
              'API double lua_reset(void) { return 0.0; }\n',
              'API double lua_reset(void) { return 0.0; }\nAPI const char *lua_get_cwd(void) { return ""; }\n'
          )
          PY

          git diff --check
          cc -shared -fPIC -O2 -Wall -Wextra -Werror \
            -Wl,-soname,Apollo.so \
            -o /tmp/Apollo.so \
            tools/arch-linux/apollo_linux_stub.c
          nm -D /tmp/Apollo.so | grep -q ' lua_get_cwd$'

      - name: Commit final fixes
        run: |
          set -euo pipefail
          git config user.name "Merlin"
          git config user.email "merlinp2000@gmail.com"
          git add \
            scripts/file_functions/file_functions.gml \
            scripts/window_functions/window_functions.gml \
            tools/arch-linux/apollo_linux_stub.c
          git commit -m "linux: polish file dialog restart and Apollo fallback"
          git push origin HEAD:arch-linux
